# Baseline: an average business hour, 50% of peak (assumption A4) = 300 journeys started per hour.
# Reference response times for later runs. Needs a test environment or SCTI's written approval (plan section 2).
#   jmeter -n -t booking-journey.jmx -q profiles/baseline.properties -Jhost=<approved host> -l results/baseline.jtl -e -o results/baseline-report

# 10 min ramp-up, 60 min steady, 5 min ramp-down, then 5 min for journeys in progress to finish.
schedule=rate(0) random_arrivals(10 min) rate(300/hour) random_arrivals(60 min) random_arrivals(5 min) rate(0) pause(5 min)
# Never resolves, so nothing is sent until -Jhost=<approved host> is given after -q.
host=approved-test-host.invalid
