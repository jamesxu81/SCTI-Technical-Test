# Stress: steps of 100%, 150%, 200%, 300% and 400% of peak (600 to 2,400 journeys per hour), 10 min each,
# then 15 min back at 100% to check recovery. Finds the breaking point (plan section 7).
# Needs a test environment or SCTI's written approval (plan section 2).
#   jmeter -n -t booking-journey.jmx -q profiles/stress.properties -Jhost=<approved host> -l results/stress.jtl -e -o results/stress-report

schedule=rate(0) random_arrivals(10 min) rate(600/hour) random_arrivals(10 min) \
  random_arrivals(2 min) rate(900/hour) random_arrivals(10 min) \
  random_arrivals(2 min) rate(1200/hour) random_arrivals(10 min) \
  random_arrivals(2 min) rate(1800/hour) random_arrivals(10 min) \
  random_arrivals(2 min) rate(2400/hour) random_arrivals(10 min) \
  random_arrivals(1 min) rate(600/hour) random_arrivals(15 min) \
  random_arrivals(5 min) rate(0) pause(5 min)
# Never resolves, so nothing is sent until -Jhost=<approved host> is given after -q.
host=approved-test-host.invalid
