# Smoke: exactly 1 full journey with short think times, to check the script works.
# The only profile allowed against the live site (same traffic as one UI test run; creates 1 draft quote).
#   jmeter -n -t booking-journey.jmx -q profiles/smoke.properties -l results/smoke.jtl -e -o results/smoke-report

# Two arrivals expected in the first minute; max.journeys lets only the first one run.
schedule=rate(2/min) random_arrivals(1 min) pause(2 min)
max.journeys=1
# Always the full journey (S4).
funnel.min=100
think.scale=0.1
