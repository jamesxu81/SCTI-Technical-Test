name: All Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'specs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'specs/**']
  workflow_dispatch:

permissions:
  contents: read
  # Lets dorny/test-reporter publish a check run with the results.
  checks: write

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: all-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  tests:
    name: ${{ matrix.category }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.category == 'UI' && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        category: [Unit, Validation, Mock, Component, API, Integration, UI]
    env:
      RESULTS_DIR: ${{ github.workspace }}/TestResults/${{ matrix.category }}
      # Only used by the UI job.
      TEST_Headless: true
      UI_WORKERS: 3
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TechnicalTest.sln

      - name: Build
        run: dotnet build TechnicalTest.sln --no-restore --configuration "$CONFIGURATION"

      - name: Install Playwright browser
        if: matrix.category == 'UI'
        run: pwsh "tests/bin/$CONFIGURATION/net8.0/playwright.ps1" install --with-deps chromium

      - name: Run ${{ matrix.category }} tests
        env:
          CATEGORY: ${{ matrix.category }}
          # Reqnroll's HTML report (UI only); other categories don't produce one.
          REQNROLL_FORMATTERS_HTML: outputFilePath=${{ env.RESULTS_DIR }}/reqnroll-report.html
        run: |
          workers=()
          if [ "$CATEGORY" = "UI" ]; then workers=("NUnit.NumberOfTestWorkers=$UI_WORKERS"); fi
          dotnet test TechnicalTest.sln \
            --no-build \
            --configuration "$CONFIGURATION" \
            --filter "Category=$CATEGORY" \
            --results-directory "$RESULTS_DIR" \
            --logger "trx;LogFileName=$CATEGORY.trx" \
            --logger "html;LogFileName=$CATEGORY.html" \
            --logger "console;verbosity=normal" \
            -- NUnit.WorkDirectory="$RESULTS_DIR" "${workers[@]}"

      - name: Upload ${{ matrix.category }} test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.category }}
          # TRX and HTML reports; for UI also the Reqnroll HTML report, and screenshots, traces, videos and network logs under TestResults/ui.
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Publish ${{ matrix.category }} test summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        # Pull requests from forks get a read-only token and can't create check runs.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        with:
          name: ${{ matrix.category }} test results
          path: TestResults/${{ matrix.category }}/*.trx
          reporter: dotnet-trx
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false
